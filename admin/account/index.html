<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="referrer" content="no-referrer">
<title>Set Password · 169 KS Tools</title>
<style>
:root{
  --bg:#0b1220;
  --panel:#0f172a;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --line:#334155;
  --gold:#facc15;
  --blue:#2563eb;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:14px;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,sans-serif
}
main{max-width:470px;margin:5vh auto}
a{color:var(--muted);text-decoration:none}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px
}
h1{color:var(--gold);margin:12px 0 6px}
.note{color:var(--muted);font-size:.8rem;line-height:1.45}
.required{
  display:none;
  margin:10px 0;
  padding:9px;
  border-radius:9px;
  border:1px solid rgba(250,204,21,.45);
  background:rgba(250,204,21,.08);
  color:#fde68a;
  font-size:.78rem
}
label{
  display:grid;
  gap:6px;
  margin-top:11px;
  color:#cbd5e1;
  font-size:.8rem
}
input{
  width:100%;
  padding:11px;
  border-radius:9px;
  border:1px solid #475569;
  background:#020617;
  color:white;
  font:inherit
}
button{
  width:100%;
  margin-top:14px;
  padding:11px;
  border:0;
  border-radius:999px;
  background:var(--blue);
  color:white;
  font:inherit;
  font-weight:850;
  cursor:pointer
}
button:disabled{opacity:.65;cursor:wait}
.msg{
  min-height:20px;
  margin-top:10px;
  font-size:.8rem;
  line-height:1.45
}
.ok{color:#86efac}
.error{color:#fca5a5}
.status{color:#93c5fd}
</style>
</head>
<body>
<main>
  <div class="card">
    <a href="../">← Admin Dashboard</a>

    <h1>Choose Your Password</h1>

    <div class="note">
      Your password is private to you. Use at least 12 characters.
    </div>

    <div id="required" class="required">
      Your temporary password must be changed before you can use the admin tools.
    </div>

    <form id="passwordForm" novalidate>
      <label>
        New password
        <input
          id="p1"
          name="new-password"
          type="password"
          minlength="12"
          maxlength="128"
          autocomplete="new-password"
          required
        >
      </label>

      <label>
        Confirm password
        <input
          id="p2"
          name="confirm-password"
          type="password"
          minlength="12"
          maxlength="128"
          autocomplete="new-password"
          required
        >
      </label>

      <button id="save" type="submit">Update Password</button>
    </form>

    <div id="msg" class="msg"></div>
  </div>
</main>

<script>
const PROJECT_REF="iqjvzhgodwufvepegwyj";
const KEY="sb_publishable_yLRLyVxBPBEoJob1kOznZg_bJoqlg-j";
const CHANGE_PASSWORD_API=
  "https://iqjvzhgodwufvepegwyj.supabase.co/functions/v1/admin-change-password";

const $=id=>document.getElementById(id);

if(new URLSearchParams(location.search).get("required")==="1"){
  $("required").style.display="block";
}

function findStoredSession(){
  const preferred=`sb-${PROJECT_REF}-auth-token`;
  const keys=[preferred];

  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(
      key &&
      key.startsWith("sb-") &&
      key.endsWith("-auth-token") &&
      !keys.includes(key)
    ){
      keys.push(key);
    }
  }

  for(const key of keys){
    const raw=localStorage.getItem(key);
    if(!raw)continue;

    try{
      const parsed=JSON.parse(raw);

      // Normal supabase-js v2 session storage.
      if(parsed?.access_token){
        return {key,session:parsed};
      }

      // Defensive fallback for wrapped session formats.
      if(parsed?.currentSession?.access_token){
        return {key,session:parsed.currentSession};
      }

      if(parsed?.session?.access_token){
        return {key,session:parsed.session};
      }
    }catch{}
  }

  return null;
}

function clearStoredSession(){
  const keys=[];

  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(
      key &&
      key.startsWith("sb-") &&
      key.endsWith("-auth-token")
    ){
      keys.push(key);
    }
  }

  for(const key of keys){
    localStorage.removeItem(key);
  }
}

$("passwordForm").addEventListener("submit",async(event)=>{
  event.preventDefault();

  const a=$("p1").value;
  const b=$("p2").value;

  $("msg").textContent="";
  $("msg").className="msg";

  if(a.length<12){
    $("msg").textContent="Use at least 12 characters.";
    $("msg").className="msg error";
    return;
  }

  if(a!==b){
    $("msg").textContent="Passwords do not match.";
    $("msg").className="msg error";
    return;
  }

  const stored=findStoredSession();

  if(!stored?.session?.access_token){
    $("msg").textContent=
      "Your admin login session could not be found. Return to Admin Login and sign in again.";
    $("msg").className="msg error";
    return;
  }

  $("save").disabled=true;
  $("save").textContent="Updating Password…";
  $("msg").textContent="Updating your password securely…";
  $("msg").className="msg status";

  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),15000);

  try{
    const response=await fetch(CHANGE_PASSWORD_API,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":KEY,
        "Authorization":"Bearer "+stored.session.access_token
      },
      body:JSON.stringify({
        new_password:a
      }),
      signal:controller.signal
    });

    let result={};

    try{
      result=await response.json();
    }catch{
      throw new Error(
        `The password service returned an invalid response (HTTP ${response.status}).`
      );
    }

    if(!response.ok||!result.ok){
      throw new Error(
        result.error||
        `Password update failed (HTTP ${response.status}).`
      );
    }

    $("p1").value="";
    $("p2").value="";

    $("msg").textContent=
      "Password updated successfully. Returning you to Admin Login…";
    $("msg").className="msg ok";

    // The password change may invalidate the old session.
    // Remove the cached login and deliberately start a fresh one.
    clearStoredSession();

    setTimeout(()=>{
      location.replace("../?password_changed=1");
    },1000);

  }catch(error){
    if(error?.name==="AbortError"){
      $("msg").textContent=
        "The password service did not respond within 15 seconds. Please tell the super-admin.";
    }else{
      $("msg").textContent=
        error?.message||
        "Password could not be changed. Please try again.";
    }

    $("msg").className="msg error";
  }finally{
    clearTimeout(timeout);
    $("save").disabled=false;
    $("save").textContent="Update Password";
  }
});
</script>
</body>
</html>
