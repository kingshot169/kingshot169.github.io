<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Transfer Admin · 169 KS Tools</title>
<link rel="stylesheet" href="../../shared/foundation.css">
<link rel="stylesheet" href="../../shared/site-preferences.css">
<script src="../../shared/translations.js" defer></script>
<script src="../../shared/site-preferences.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="./transfers.css">
</head>
<body>
<main>
<div class="top">
  <div>
    <a href="../" data-ks-text="← Admin Dashboard" data-site-nav>← Admin Dashboard</a>
    <h1 data-ks-text="Transfer Admin">Transfer Admin</h1>
  </div>
  <div>
    <span id="adminName" translate="no" class="muted"></span>
    <button id="signOut" data-ks-text="Sign Out">Sign Out</button>
  </div>
</div>

<div class="statusline">
<label><span data-ks-text="Status filter">Status filter</span><select id="filter">
<option value="" data-ks-text="All">All</option>
<option value="submitted" data-ks-text="Submitted">Submitted</option>
<option value="reviewing" data-ks-text="Reviewing">Reviewing</option>
<option value="approved" data-ks-text="Approved">Approved</option>
<option value="waitlisted" data-ks-text="Waitlisted">Waitlisted</option>
<option value="declined" data-ks-text="Declined">Declined</option>
</select>
</label>
<button id="refresh" data-ks-text="Refresh">Refresh</button>
</div>

<div id="msg" class="msg"></div>
<div id="list"></div>
</main>

<script>
const SUPABASE_URL="https://iqjvzhgodwufvepegwyj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_yLRLyVxBPBEoJob1kOznZg_bJoqlg-j";
const ADMIN_TRANSFERS_URL="https://iqjvzhgodwufvepegwyj.supabase.co/functions/v1/admin-transfers";

const sbClient=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const $=id=>document.getElementById(id);
let applications=[];

function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function pwr(n){
  n=Number(n);
  if(!Number.isFinite(n))return"";
  if(n>=1e9)return(n/1e9).toFixed(2)+"B";
  if(n>=1e6)return(n/1e6).toFixed(1)+"M";
  return n.toLocaleString();
}

function fmtDate(s){
  try{return new Date(s).toLocaleString()}
  catch{return s||""}
}

async function session(){
  const {data}=await sbClient.auth.getSession();

  if(!data.session){
    location.href="../";
    return null;
  }

  return data.session;
}

async function api(method,body){
  const s=await session();
  if(!s)return;

  const r=await fetch(ADMIN_TRANSFERS_URL,{
    method,
    headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_PUBLISHABLE_KEY,
      "Authorization":"Bearer "+s.access_token
    },
    body:body?JSON.stringify(body):undefined
  });

  let j={};

  try{
    j=await r.json();
  }catch{}

  if(!r.ok){
    throw KSPreferences.apiError(j.error,"Request failed",{});
  }

  return j;
}

function render(){
  const f=$("filter").value;
  const rows=applications.filter(a=>!f||a.status===f);

  $("list").innerHTML=rows.length
    ? rows.map(a=>`
      <section class="card" data-card-id="${esc(a.id)}">
        <div class="grid">

          <div class="kv">
            <div class="k" data-ks-text="Player">Player</div>
            <div class="v player-box">
              ${
                a.avatar_url
                  ? `<img class="player-avatar"
                       src="${esc(a.avatar_url)}"
                       alt="Player profile picture" data-ks-alt="Player profile picture"
                       onerror="this.style.display='none'">`
                  : ``
              }
              <div>
                <strong>${esc(a.player_name)}</strong><br>
                ${KSPreferences.html("Player ID {id}",{id:a.player_id})}
              </div>
            </div>
          </div>

          <div class="kv">
            <div class="k" data-ks-text="State / Alliance">State / Alliance</div>
            <div class="v">
              ${esc(a.kingdom)}<br>
              ${esc(a.alliance_abbr||"")} ${esc(a.alliance_name||"")}
            </div>
          </div>

          <div class="kv">
            <div class="k" data-ks-text="Power / TC">Power / TC</div>
            <div class="v">
              ${esc(pwr(a.power))}<br>
              ${KSPreferences.html("Town Center {level}",{level:a.town_center_level})}
            </div>
          </div>

          <div class="kv">
            <div class="k" data-ks-text="Coordinates">Coordinates</div>
            <div class="v">
              X ${esc(a.x)} · Y ${esc(a.y)}
            </div>
          </div>

          <div class="kv">
            <div class="k" data-ks-text="Transfer passes">Transfer passes</div>
            <div class="v">${esc(a.transfer_passes)}</div>
          </div>

          <div class="kv">
            <div class="k" data-ks-text="Preferred alliance">Preferred alliance</div>
            <div class="v">${KSPreferences.fallbackHTML(a.preferred_alliance,"No preference")}</div>
          </div>

          <div class="kv">
            <div class="k" data-ks-text="Referrer / Friends">Referrer / Friends</div>
            <div class="v">${esc(a.referrer_or_friends||"—")}</div>
          </div>

          <div class="kv">
            <div class="k" data-ks-text="Submitted">Submitted</div>
            <div class="v">${KSPreferences.html("{time}",{time:KSPreferences.dateTime(a.submitted_at)})}</div>
          </div>

        </div>

        <div class="kv application-detail" >
          <div class="k" data-ks-text="Reason">Reason</div>
          <div class="v reason">${esc(a.reason)}</div>
        </div>

        <div class="kv application-detail" >
          <div class="k" data-ks-text="Notes">Notes</div>
          <div class="v reason">${esc(a.notes||"—")}</div>
        </div>

        <div class="statusline">
          <label>
            <span data-ks-text="Status">Status</span>
            <select data-status-id="${esc(a.id)}">
              ${
                ["submitted","reviewing","approved","waitlisted","declined"]
                  .map(s=>`
                    <option value="${s}" data-ks-text="${s}" ${a.status===s?"selected":""}>
                      ${s}
                    </option>
                  `).join("")
              }
            </select>
          </label>

          <span class="muted">${KSPreferences.html("Reference {reference}",{reference:a.id})}</span>

          <span class="spacer"></span>

          <button
            type="button"
            class="danger"
            data-delete-id="${esc(a.id)}"
            data-player-name="${esc(a.player_name)}" data-ks-text="Delete Application">
            Delete Application
          </button>
        </div>
      </section>
    `).join("")
    : `<div class="card muted" data-ks-text="No applications found.">No applications found.</div>`;

  document.querySelectorAll("select[data-status-id]").forEach(sel=>{
    sel.onchange=async()=>{
      const applicationId=sel.dataset.statusId;
      const app=applications.find(x=>x.id===applicationId);
      const old=app?.status;

      sel.disabled=true;

      try{
        await api("POST",{
          application_id:applicationId,
          status:sel.value
        });

        if(app)app.status=sel.value;

        KSPreferences.setText($("msg"), "Status updated.");
        $("msg").className="msg ok";

        render();
      }catch(e){
        sel.value=old||"submitted";
        KSPreferences.setError($("msg"),e);
        $("msg").className="msg error";
      }finally{
        sel.disabled=false;
      }
    };
  });

  document.querySelectorAll("button[data-delete-id]").forEach(btn=>{
    btn.onclick=async()=>{
      const applicationId=btn.dataset.deleteId;
      const playerName=btn.dataset.playerName||KSPreferences.message("this player");

      const confirmed=window.confirm(
        KSPreferences.text('Delete the transfer application for {name}? This cannot be undone.',{name:playerName})
      );

      if(!confirmed)return;

      btn.disabled=true;
      KSPreferences.setText(btn, "Deleting…");

      try{
        await api("DELETE",{
          application_id:applicationId
        });

        applications=applications.filter(a=>a.id!==applicationId);

        KSPreferences.setText($("msg"),"Application for {name} deleted.",{name:playerName});
        $("msg").className="msg ok";

        render();
      }catch(e){
        KSPreferences.setError($("msg"),e);
        $("msg").className="msg error";

        btn.disabled=false;
        KSPreferences.setText(btn, "Delete Application");
      }
    };
  });
}

async function load(){
  KSPreferences.setText($("msg"), "Loading…");
  $("msg").className="msg";

  try{
    const j=await api("GET");

    applications=j.applications||[];

    KSPreferences.setResponse($("adminName"), j.admin?.display_name||j.admin?.username, "Admin");

    KSPreferences.setText($("msg"), "");
    render();

  }catch(e){
    KSPreferences.setError($("msg"),e);
    $("msg").className="msg error";
  }
}

$("refresh").onclick=load;
$("filter").onchange=render;

$("signOut").onclick=async()=>{
  await sbClient.auth.signOut();
  location.href="../";
};

load();
</script>

<script>window.KSPreferences?.mount();</script>
</body>
</html>
