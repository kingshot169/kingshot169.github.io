<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Player Search · 169 KS Tools</title>
<link rel="stylesheet" href="../../shared/foundation.css">
<link rel="stylesheet" href="../../shared/site-preferences.css">
<script src="../../shared/translations.js" defer></script>
<script src="../../shared/site-preferences.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="./player-search.css">
</head>
<body>
<main>

<div class="top">
  <div>
    <div class="toplinks">
      <a href="../" data-ks-text="← Admin Dashboard" data-site-nav>← Admin Dashboard</a>
    </div>
    <h1 data-ks-text="Player Search">Player Search</h1>
  </div>
  <div>
    <span id="adminName" translate="no" class="muted"></span>
    <button id="signOut" data-ks-text="Sign Out">Sign Out</button>
  </div>
</div>

<section class="card">
  <h2 data-ks-text="Search Kingshot Player">Search Kingshot Player</h2>
  <div class="searchbar search-detail" >
    <label><span data-ks-text="Kingshot Player ID">Kingshot Player ID</span><input id="playerId" inputmode="numeric" placeholder="e.g. 24649596" data-ks-placeholder="e.g. 24649596">
    </label>
    <button id="searchBtn" class="primary" data-ks-text="Search Player">Search Player</button>
  </div>
  <div id="msg" class="msg"></div>
</section>

<div id="results">

  <section class="card">
    <div class="profile">
      <img id="avatar" class="avatar" alt="Player profile picture" data-ks-alt="Player profile picture">
      <div>
        <div id="playerName" translate="no" class="name"></div>
        <div id="playerMeta" class="subline"></div>
      </div>
    </div>

    <div class="statgrid">
      <div class="kv"><div class="k" data-ks-text="Power">Power</div><div id="power" class="v"></div></div>
      <div class="kv"><div class="k" data-ks-text="Town Center">Town Center</div><div id="tc" class="v"></div></div>
      <div class="kv"><div class="k">VIP</div><div id="vip" class="v"></div></div>
      <div class="kv"><div class="k" data-ks-text="Kills">Kills</div><div id="kills" class="v"></div></div>

      <div class="kv"><div class="k" data-ks-text="Coordinates">Coordinates</div><div id="coords" class="v"></div></div>
      <div class="kv"><div class="k" data-ks-text="Office">Office</div><div id="office" class="v"></div></div>
      <div class="kv"><div class="k" data-ks-text="Online">Online</div><div id="online" class="v"></div></div>
      <div class="kv"><div class="k" data-ks-text="Last Active">Last Active</div><div id="lastActive" class="v"></div></div>
    </div>
  </section>

  <section class="card" id="govSection">
    <div class="section-title">
      <h2 data-ks-text="Governor Gear">Governor Gear</h2>
      <span id="govGearState" class="badge"></span>
    </div>
    <div id="govGear"></div>
  </section>

  <section class="card">
    <div class="section-title">
      <h2 data-ks-text="Heroes &amp; Hero Gear">Heroes & Hero Gear</h2>
      <span id="heroCount" class="badge"></span>
    </div>
    <div id="heroes" class="hero-grid"></div>
  </section>

  <section class="card">
    <div class="section-title">
      <h2 data-ks-text="Kingdom Rankings">Kingdom Rankings</h2>
      <span id="rankCount" class="badge"></span>
    </div>
    <div id="ranks" class="rank-grid"></div>
  </section>

</div>

</main>

<script>
const SUPABASE_URL="https://iqjvzhgodwufvepegwyj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_yLRLyVxBPBEoJob1kOznZg_bJoqlg-j";
const SEARCH_URL="https://iqjvzhgodwufvepegwyj.supabase.co/functions/v1/admin-player-search";

const sbClient=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const $=id=>document.getElementById(id);

function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function numberFmt(n){
  const v=Number(n);
  return Number.isFinite(v)?v.toLocaleString():"—";
}

function compact(n){
  const v=Number(n);
  if(!Number.isFinite(v))return"—";
  if(v>=1e9)return(v/1e9).toFixed(2)+"B";
  if(v>=1e6)return(v/1e6).toFixed(1)+"M";
  if(v>=1e3)return(v/1e3).toFixed(1)+"K";
  return v.toLocaleString();
}

function yesNo(v){
  if(v===true)return KSPreferences.message("Yes");
  if(v===false)return KSPreferences.message("No");
  return"—";
}

function rankNumber(r){
  const v=
    r?.kingdom_rank ??
    r?.rank ??
    r?.position ??
    null;

  return v==null ? "—" : `#${v}`;
}

async function session(){
  const {data}=await sbClient.auth.getSession();

  if(!data.session){
    location.href="../";
    return null;
  }

  return data.session;
}

async function searchPlayer(){
  const playerId=$("playerId").value.replace(/\s/g,"");

  KSPreferences.setText($("msg"), "");
  $("msg").className="msg";

  if(!/^\d{4,20}$/.test(playerId)){
    KSPreferences.setText($("msg"), "Enter a valid numeric Player ID.");
    $("msg").className="msg error";
    return;
  }

  const s=await session();
  if(!s)return;

  $("searchBtn").disabled=true;
  KSPreferences.setText($("searchBtn"), "Searching…");
  $("results").style.display="none";

  try{
    const r=await fetch(SEARCH_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_PUBLISHABLE_KEY,
        "Authorization":"Bearer "+s.access_token
      },
      body:JSON.stringify({player_id:playerId})
    });

    let j={};
    try{j=await r.json()}catch{}

    if(!r.ok||!j.ok){
      throw KSPreferences.apiError(j.error,"Player search failed",{});
    }

    KSPreferences.setResponse($("adminName"),j.admin?.display_name||j.admin?.username,"Admin");

    renderPlayer(j);

    KSPreferences.setText($("msg"), "Player loaded.");
    $("msg").className="msg ok";
    $("results").style.display="block";

  }catch(e){
    KSPreferences.setError($("msg"),e);
    $("msg").className="msg error";
  }finally{
    $("searchBtn").disabled=false;
    KSPreferences.setText($("searchBtn"), "Search Player");
  }
}

function renderPlayer(j){
  const p=j.player||{};
  const alliance=p.alliance||{};

  $("avatar").src=p.avatar_url||"";
  $("avatar").style.display=p.avatar_url?"block":"none";

  KSPreferences.setResponse($("playerName"),p.name,"Player {id}",{id:p.player_id??""});

  $("playerMeta").innerHTML=
    KSPreferences.html("Player ID {id}",{id:p.player_id??"—"})+`<br>`+
    KSPreferences.html("State {state}",{state:p.kingdom??"—"})+`<br>`+
    `${esc(alliance.abbr||"")} ${esc(alliance.name||"")}`;

  KSPreferences.setRawText($("power"), compact(p.power));
  KSPreferences.setRawText($("tc"), p.town_center_level??"—");
  KSPreferences.setRawText($("vip"), p.vip??"—");
  KSPreferences.setRawText($("kills"), numberFmt(p.kills));

  KSPreferences.setRawText($("coords"), (p.x!=null&&p.y!=null)
      ? `X ${p.x} · Y ${p.y}`
      : "—");

  KSPreferences.setRawText($("office"), p.office||"—");
  KSPreferences.setValue($("online"), yesNo(p.online));
  KSPreferences.setRawText($("lastActive"), p.last_login||
    p.last_active_at||
    "—");

  renderGovGear(j.gov_gear);
  renderHeroes(j.heroes||[]);
  renderRanks(j.ranks);
}

function renderGovGear(g){
  if(!g){
    KSPreferences.setText($("govGearState"), "No data");
    $("govGear").innerHTML=
      "<div class=\"hidden-note\" data-ks-text=\"No governor gear data returned.\">No governor gear data returned.</div>";
    return;
  }

  if(g.hidden){
    KSPreferences.setText($("govGearState"), "Hidden");
    $("govGear").innerHTML=
      `<div class="hidden-note">${KSPreferences.fallbackHTML(g.message,"This player is hiding their governor gear.")}</div>`;
    return;
  }

  const items=Array.isArray(g.items)?g.items:[];

  KSPreferences.setText($("govGearState"),"{count} items",{count:items.length});

  $("govGear").innerHTML=
    `<div class="gov-grid">
      ${
        items.length
          ? items.map(item=>{
              const gems=Array.isArray(item.gems)?item.gems:[];
              return `
                <div class="gov-item">
                  <div class="gov-head">
                    ${
                      item.icon
                        ? `<img class="gov-icon" src="${esc(item.icon)}" alt="">`
                        : ``
                    }
                    <div>
                      <div class="gov-name">${KSPreferences.fallbackHTML(item.name||item.slot,"Gear")}</div>
                      <div class="gov-sub">${esc(item.slot||"")}</div>
                    </div>
                  </div>

                  <div class="gov-stats">
                    <div class="mini">
                      <div class="k" data-ks-text="Quality">Quality</div>
                      <div class="v">${esc(item.quality??"—")}</div>
                    </div>
                    <div class="mini">
                      <div class="k" data-ks-text="Tier">Tier</div>
                      <div class="v">${esc(item.tier??"—")}</div>
                    </div>
                    <div class="mini">
                      <div class="k" data-ks-text="Stars">Stars</div>
                      <div class="v">${esc(item.star??"—")}</div>
                    </div>
                    <div class="mini">
                      <div class="k" data-ks-text="Strength">Strength</div>
                      <div class="v">${esc(item.strength_level??"—")}</div>
                    </div>
                  </div>

                  ${
                    gems.length
                      ? `<div class="gems">
                          ${gems.map(gem=>`
                            <span class="gem">${esc(
                              gem?.name ??
                              gem?.label ??
                              gem?.level ??
                              JSON.stringify(gem)
                            )}</span>
                          `).join("")}
                        </div>`
                      : ``
                  }
                </div>
              `;
            }).join("")
          : "<div class=\"hidden-note\" data-ks-text=\"No governor gear items returned.\">No governor gear items returned.</div>"
      }
    </div>`;
}


const HERO_GEAR_IMAGES={
  infantry:{
    helmet:"https://kingshotoptimizer.com/images/icons/gear-pieces/infantry-helm.png",
    gloves:"https://kingshotoptimizer.com/images/icons/gear-pieces/infantry-gloves.png",
    armor:"https://kingshotoptimizer.com/images/icons/gear-pieces/infantry-chest.png",
    chest:"https://kingshotoptimizer.com/images/icons/gear-pieces/infantry-chest.png",
    boots:"https://kingshotoptimizer.com/images/icons/gear-pieces/infantry-boots.png"
  },
  cavalry:{
    helmet:"https://kingshotoptimizer.com/images/icons/gear-pieces/cavalry-helm.png",
    gloves:"https://kingshotoptimizer.com/images/icons/gear-pieces/cavalry-gloves.png",
    armor:"https://kingshotoptimizer.com/images/icons/gear-pieces/cavalry-chest.png",
    chest:"https://kingshotoptimizer.com/images/icons/gear-pieces/cavalry-chest.png",
    boots:"https://kingshotoptimizer.com/images/icons/gear-pieces/cavalry-boots.png"
  },
  archer:{
    helmet:"https://kingshotoptimizer.com/images/icons/gear-pieces/archer-helm.png",
    gloves:"https://kingshotoptimizer.com/images/icons/gear-pieces/archer-gloves.png",
    armor:"https://kingshotoptimizer.com/images/icons/gear-pieces/archer-chest.png",
    chest:"https://kingshotoptimizer.com/images/icons/gear-pieces/archer-chest.png",
    boots:"https://kingshotoptimizer.com/images/icons/gear-pieces/archer-boots.png"
  }
};

function normalizeTroop(g){
  const raw=String(g?.troop_label ?? g?.troop ?? "").toLowerCase();
  if(raw.includes("infantry") || raw==="1")return"infantry";
  if(raw.includes("cavalry") || raw==="2")return"cavalry";
  if(raw.includes("archer") || raw.includes("marksman") || raw==="3")return"archer";
  return"";
}

function normalizeSlot(g){
  const raw=String(g?.slot ?? g?.name ?? "").toLowerCase();
  if(raw.includes("helm"))return"helmet";
  if(raw.includes("glove"))return"gloves";
  if(raw.includes("armor") || raw.includes("armour") || raw.includes("chest"))return"armor";
  if(raw.includes("boot"))return"boots";
  return"";
}

function heroGearQualityClass(g){
  if(g?.red)return"quality-red";

  const raw=String(
    g?.quality_label ??
    g?.quality_key ??
    g?.quality ??
    ""
  ).toLowerCase();

  if(raw.includes("red"))return"quality-red";
  if(raw.includes("gold") || raw.includes("mythic") || raw.includes("orange") || raw.includes("legendary"))return"quality-gold";
  if(raw.includes("purple") || raw.includes("epic"))return"quality-purple";
  if(raw.includes("blue") || raw.includes("rare"))return"quality-blue";
  if(raw.includes("green") || raw.includes("uncommon"))return"quality-green";
  if(raw.includes("grey") || raw.includes("gray") || raw.includes("common"))return"quality-grey";

  const q=Number(g?.quality);
  if(Number.isFinite(q)){
    if(q>=6)return"quality-red";
    if(q===5)return"quality-gold";
    if(q===4)return"quality-purple";
    if(q===3)return"quality-blue";
    if(q===2)return"quality-green";
    if(q<=1)return"quality-grey";
  }

  return"quality-grey";
}

function heroGearImage(g){
  const quality=heroGearQualityClass(g);

  // We currently have trustworthy artwork only for Mythic/Gold gear.
  // Red gear is the ascended version of the same piece, so it is safe to reuse.
  if(quality!=="quality-gold" && quality!=="quality-red"){
    return"";
  }

  const troop=normalizeTroop(g);
  const slot=normalizeSlot(g);
  return HERO_GEAR_IMAGES?.[troop]?.[slot] || "";
}

function gearSlotIcon(g){
  const slot=normalizeSlot(g);
  if(slot==="helmet")return"⛑";
  if(slot==="gloves")return"🧤";
  if(slot==="armor")return"🛡";
  if(slot==="boots")return"🥾";
  return"⚙";
}

function renderHeroes(heroes){
  KSPreferences.setText($("heroCount"),"{count} heroes",{count:heroes.length});

  $("heroes").innerHTML=
    heroes.length
      ? heroes.map(hero=>`
        <div class="hero">
          <div class="hero-head">
            ${
              hero.icon
                ? `<img class="hero-icon" src="${esc(hero.icon)}" alt="">`
                : ``
            }
            <div>
              <div class="hero-name">${KSPreferences.fallbackHTML(hero.name,"Hero")}</div>
              <div class="hero-meta">
                ${KSPreferences.html("Lv {level} · Stars {stars} · {power}",{level:hero.level??"—",stars:hero.stars??hero.star??"—",power:compact(hero.power)})}
              </div>
            </div>
          </div>

          <div class="hero-topstats">
            <span class="hero-pill">${KSPreferences.html("Quality {quality}",{quality:hero.quality??"—"})}</span>
            <span class="hero-pill">${KSPreferences.html("Exclusive {level}",{level:hero.exclusive_gear_level??"—"})}</span>
          </div>

          ${
            Array.isArray(hero.gear)&&hero.gear.length
              ? `<div class="hero-gear-grid">
                  ${hero.gear.map(g=>{
                    const qualityClass=heroGearQualityClass(g);
                    const art=heroGearImage(g);

                    return `
                      <div class="hero-gear ${qualityClass}">
                        <div class="gear-tile">
                          <div class="gear-art-wrap">
                            ${
                              art
                                ? `<img class="hero-gear-art"
                                     src="${esc(art)}"
                                     ${KSPreferences.attribute("alt","{troop} {gear}",{troop:g.troop_label||"",gear:g.slot||g.name||KSPreferences.message("Hero gear")})}
                                     loading="lazy"
                                     onerror="this.style.display='none'">`
                                : `<div class="hero-gear-placeholder" aria-hidden="true">${gearSlotIcon(g)}</div>`
                            }

                            ${
                              g.refine_level!=null
                                ? `<span class="gear-badge refine" title="Refine level" data-ks-title="Refine level">◆${esc(g.refine_level)}</span>`
                                : ``
                            }

                            ${
                              g.enhancement_level!=null
                                ? `<span class="gear-badge enhance" title="Enhancement level" data-ks-title="Enhancement level">🔨${esc(g.enhancement_level)}</span>`
                                : ``
                            }
                          </div>

                          <div class="hero-gear-text">
                            <div class="slot">${KSPreferences.fallbackHTML(g.slot||g.name,"Gear")}</div>
                            <div class="gear-name">${KSPreferences.fallbackHTML(g.quality_label||g.quality_key||g.quality,"Gear")}</div>
                            <div class="gear-meta">
                              ${KSPreferences.html("Enhance {enhancement} · Refine {refine}",{enhancement:g.enhancement_level??"—",refine:g.refine_level??"—"})}
                            </div>
                          </div>
                        </div>
                      </div>
                    `;
                  }).join("")}
                </div>`
              : `<div class="hidden-note search-detail"  data-ks-text="No hero gear returned.">No hero gear returned.</div>`
          }
        </div>
      `).join("")
      : "<div class=\"hidden-note\" data-ks-text=\"No hero data returned.\">No hero data returned.</div>";
}

function normalizeRanks(ranks){
  if(!ranks)return[];

  if(Array.isArray(ranks)){
    return ranks;
  }

  if(Array.isArray(ranks.leaderboards)){
    return ranks.leaderboards;
  }

  if(Array.isArray(ranks.items)){
    return ranks.items;
  }

  return Object.entries(ranks)
    .filter(([k,v])=>typeof v==="object"&&v!==null)
    .map(([k,v])=>({name:k,...v}));
}

function renderRanks(ranks){
  const items=normalizeRanks(ranks);

  KSPreferences.setText($("rankCount"),"{count} ranks",{count:items.length});

  if(!items.length){
    $("ranks").innerHTML=
      "<div class=\"hidden-note\" data-ks-text=\"No ranking data returned.\">No ranking data returned.</div>";
    return;
  }

  $("ranks").innerHTML=
    items.map(r=>{
      const name=
        r.name ??
        r.label ??
        r.rank_name ??
        "";

      const value=
        r.value_label ??
        r.value ??
        r.score ??
        "";

      return `
        <div class="rank-card">
          <div class="rank-name">${KSPreferences.fallbackHTML(name,"Ranking")}</div>
          <div class="rank-place">${esc(rankNumber(r))}</div>
          <div class="rank-value">${esc(value||"")}</div>
        </div>
      `;
    }).join("");
}

$("searchBtn").onclick=searchPlayer;

$("playerId").onkeydown=e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    searchPlayer();
  }
};

$("signOut").onclick=async()=>{
  await sbClient.auth.signOut();
  location.href="../";
};

session();
</script>

<script>window.KSPreferences?.mount();</script>
</body>
</html>
