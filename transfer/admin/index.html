<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Admin Sign In · 169 KS Tools</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b1220;--panel:#0f172a;--panel2:#020617;--text:#e5e7eb;--muted:#94a3b8;--line:#334155;--gold:#facc15}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
h1{margin:0 0 8px;color:var(--gold);font-size:2rem}.sub{color:var(--muted);margin-bottom:18px}
label{display:grid;gap:6px;margin-top:12px;font-size:.84rem;color:#cbd5e1}
input{width:100%;padding:11px;border-radius:9px;border:1px solid #475569;background:var(--panel2);color:var(--text);font:inherit}
button{width:100%;margin-top:16px;border:0;border-radius:999px;padding:11px 16px;background:#2563eb;color:white;font:inherit;font-weight:800;cursor:pointer}
button:disabled{opacity:.55}.msg{min-height:20px;margin-top:10px;font-size:.85rem}.error{color:#fca5a5}.ok{color:#86efac}
a{color:var(--muted);text-decoration:none;font-size:.84rem}
</style>
</head>
<body>
<main class="card">
<a href="../">← 169 KS Tools</a>
<h1>Admin Sign In</h1>
<div class="sub">State 169 administration</div>

<label>Email<input id="email" type="email" autocomplete="username"></label>
<label>Password<input id="password" type="password" autocomplete="current-password"></label>
<button id="signIn">Sign In</button>
<div id="msg" class="msg"></div>
</main>

<script>
const SUPABASE_URL="https://iqjvzhgodwufvepegwyj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_yLRLyVxBPBEoJob1kOznZg_bJoqlg-j";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const $=id=>document.getElementById(id);

async function checkExisting(){
  const {data}=await supabase.auth.getSession();
  if(data.session){ location.href="./transfers/"; }
}
checkExisting();

$("signIn").onclick=async()=>{
  $("msg").textContent="";
  $("signIn").disabled=true;
  $("signIn").textContent="Signing in…";

  const email=$("email").value.trim();
  const password=$("password").value;

  const {data,error}=await supabase.auth.signInWithPassword({email,password});

  if(error){
    $("msg").textContent=error.message;
    $("msg").className="msg error";
    $("signIn").disabled=false;
    $("signIn").textContent="Sign In";
    return;
  }

  if(data.session){
    location.href="./transfers/";
    return;
  }

  $("msg").textContent="Sign in did not return a session.";
  $("msg").className="msg error";
  $("signIn").disabled=false;
  $("signIn").textContent="Sign In";
};

$("password").addEventListener("keydown",e=>{
  if(e.key==="Enter") $("signIn").click();
});
</script>
</body>
</html>
