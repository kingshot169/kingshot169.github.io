<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<meta name="referrer" content="no-referrer">
<title>Transfer to State 169</title>
<link rel="stylesheet" href="../shared/site-preferences.css">
<script src="../shared/translations.js" defer></script>
<script src="../shared/site-preferences.js"></script>
<style>
:root{--bg:#0b1220;--panel:#0f172a;--panel2:#020617;--text:#e5e7eb;--muted:#94a3b8;--line:#334155;--gold:#facc15;--green:#22c55e}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:820px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:var(--muted);text-decoration:none}
header{text-align:center;padding:18px 0}h1{margin:4px 0;color:var(--gold);font-size:clamp(2rem,6vw,3.2rem)}header p{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
h2{margin-top:0;font-size:1.1rem}.lookup{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
label{display:grid;gap:6px;font-size:.84rem;color:#cbd5e1}input,select,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid #475569;background:var(--panel2);color:var(--text);font:inherit}
textarea{min-height:110px;resize:vertical}button{border:0;border-radius:999px;padding:11px 16px;background:#2563eb;color:white;font:inherit;font-weight:800;cursor:pointer}
button.secondary{background:#334155}button.submit{background:#16a34a}button:disabled{opacity:.55}
.msg{min-height:20px;margin-top:10px;font-size:.85rem}.warn{color:#fdba74}.error{color:#fca5a5}.ok{color:#86efac}
#playerCard,#application,#successCard{display:none}.player{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;padding:14px;border:1px solid rgba(34,197,94,.4);border-radius:12px;background:rgba(34,197,94,.08)}
.avatar{width:72px;height:72px;border-radius:12px;display:grid;place-items:center;background:#020617;font-size:2rem}.name{font-size:1.35rem;font-weight:900;color:#bbf7d0}.meta{color:#cbd5e1;line-height:1.45;font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
.consent{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:.8rem}.consent input{width:auto}
.success{padding:16px;border:1px solid rgba(34,197,94,.4);border-radius:12px;background:rgba(34,197,94,.08)}
.success h2{color:#bbf7d0}.ref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:#cbd5e1}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding:10px}
@media(max-width:650px){.lookup,.grid{grid-template-columns:1fr}.full{grid-column:auto}.lookup button{width:100%}}

.site-credit{
  margin:18px auto 10px;
  padding:0 8px;
  text-align:center;
  color:#64748b;
  font-size:.72rem;
  line-height:1.4;
}
.site-credit-byline{
  margin-top:2px;
  font-size:.66rem;
  color:#475569;
}

</style>
</head>
<body>
<main>
<div class="top"><a href="../" data-ks-text="← 169 KS Tools" data-site-nav>← 169 KS Tools</a><strong data-ks-text="STATE 169">STATE 169</strong></div>
<header><div style="font-size:2.4rem">🔄</div><h1 data-ks-text="Transfer Application">Transfer Application</h1><p data-ks-text="Verify your Kingshot profile, then complete the short application.">Verify your Kingshot profile, then complete the short application.</p></header>

<section class="card">
<h2 data-ks-text="1. Find your Kingshot profile">1. Find your Kingshot profile</h2>
<div class="lookup">
<label><span data-ks-text="Kingshot Player ID">Kingshot Player ID</span><input id="fid" inputmode="numeric" placeholder="e.g. 24649596" data-ks-placeholder="e.g. 24649596"></label>
<button id="find" data-ks-text="Find Player">Find Player</button>
</div>
<div id="lookupMsg" class="msg"></div>

<div id="playerCard">
<div class="player">
<div class="avatar">👤</div>
<div><div id="pName" translate="no" class="name"></div><div id="pMeta" class="meta"></div></div>
</div>
<div class="actions"><button id="continue" data-ks-text="Continue Application">Continue Application</button><button id="change" class="secondary" data-ks-text="Different Player">Different Player</button></div>
</div>
</section>

<section id="application" class="card">
<h2 data-ks-text="2. Transfer details">2. Transfer details</h2>
<form id="form">
<div class="grid">
<label><span data-ks-text="Transfer Passes">Transfer Passes</span><input name="passes" required placeholder="How many do you currently have?" data-ks-placeholder="How many do you currently have?"></label>
<label><span data-ks-text="Preferred 169 Alliance">Preferred 169 Alliance</span><select name="preferred"><option value="" data-ks-text="No preference">No preference</option><option>KRZ</option><option>GRD</option><option value="Other / discuss with leadership" data-ks-text="Other / discuss with leadership">Other / discuss with leadership</option></select>
</label>
<label class="full"><span data-ks-text="Referred by / Friends in 169">Referred by / Friends in 169</span><input name="friends" placeholder="Optional" data-ks-placeholder="Optional"></label>
<label class="full"><span data-ks-text="Why would you like to transfer to State 169?">Why would you like to transfer to State 169?</span><textarea name="reason" required></textarea></label>
<label class="full"><span data-ks-text="Anything else we should know?">Anything else we should know?</span><textarea name="notes" placeholder="Optional" data-ks-placeholder="Optional"></textarea></label>
<div class="full consent"><input id="consent" type="checkbox" required><label for="consent" data-ks-text="I understand this application and my verified Kingshot profile information will be shared with authorised State 169 leadership for transfer review.">I understand this application and my verified Kingshot profile information will be shared with authorised State 169 leadership for transfer review.</label></div>
</div>
<div class="actions"><button id="submitBtn" class="submit" type="submit" data-ks-text="Submit Application">Submit Application</button></div>
<div id="submitMsg" class="msg"></div>
</form>
</section>

<section id="successCard" class="card">
<div class="success">
<h2 data-ks-text="Application received">Application received</h2>
<p id="successMessage"></p>
<p data-ks-text="Reference:">Reference:</p>
<div id="successRef" translate="no" class="ref"></div>
<div class="actions"><a href="../" style="text-decoration:none"><button type="button" class="secondary" data-ks-text="Back to 169 KS Tools">Back to 169 KS Tools</button></a></div>
</div>
</section>

</main>

<script>
const LOOKUP_URL="https://iqjvzhgodwufvepegwyj.supabase.co/functions/v1/player-lookup";
const SUBMIT_URL="https://iqjvzhgodwufvepegwyj.supabase.co/functions/v1/submit-transfer";

// Replace this with your Supabase publishable key.
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_yLRLyVxBPBEoJob1kOznZg_bJoqlg-j";

let verified=null;
const $=id=>document.getElementById(id);

const authHeaders=()=>({
  "Content-Type":"application/json",
  "apikey":SUPABASE_PUBLISHABLE_KEY,
  "Authorization":"Bearer "+SUPABASE_PUBLISHABLE_KEY
});

const power=n=>{
  n=Number(n);
  if(!Number.isFinite(n))return KSPreferences.message("Unknown");
  if(n>=1e9)return(n/1e9).toFixed(2).replace(/0+$/,"").replace(/\.$/,"")+"B";
  if(n>=1e6)return(n/1e6).toFixed(1).replace(/\.0$/,"")+"M";
  return n.toLocaleString();
};

async function findPlayer(){
 const fid=$("fid").value.replace(/\s/g,"");
 KSPreferences.setText($("lookupMsg"), "");
 $("lookupMsg").className="msg";

 if(!/^\d{4,20}$/.test(fid)){
   KSPreferences.setText($("lookupMsg"), "Enter a valid numeric Player ID.");
   $("lookupMsg").className="msg warn";
   return;
 }

 if(SUPABASE_PUBLISHABLE_KEY.startsWith("PASTE_")){
   KSPreferences.setText($("lookupMsg"), "Add your Supabase publishable key to this file first.");
   $("lookupMsg").className="msg warn";
   return;
 }

 $("find").disabled=true;
 KSPreferences.setText($("find"), "Finding…");

 try{
  const r=await fetch(LOOKUP_URL,{
    method:"POST",
    headers:authHeaders(),
    body:JSON.stringify({player_id:fid})
  });

  const j=await r.json();

  if(!r.ok||!j.ok||!j.player){
    throw KSPreferences.apiError(j.error,"Player lookup failed");
  }

  verified=j.player;
  KSPreferences.setResponse($("pName"), verified.name,"Player {id}",{id:verified.player_id});

  const alliance=[verified.alliance_abbr,verified.alliance_name].filter(Boolean).join(" · ");
  const metaLines=[
    KSPreferences.node("State {state}",{state:verified.kingdom??"?"}),
    alliance?document.createTextNode(alliance):KSPreferences.node("No alliance returned"),
    KSPreferences.node("Power {power}",{power:power(verified.power)}),
    KSPreferences.node("Town Center {level}",{level:verified.town_center_level??"?"}),
    KSPreferences.node("Player ID {id}",{id:verified.player_id})
  ];
  $("pMeta").replaceChildren();
  metaLines.forEach((line,i)=>{
    if(i)$("pMeta").appendChild(document.createElement("br"));
    $("pMeta").appendChild(line);
  });

  $("playerCard").style.display="block";
  $("fid").disabled=true;

  const playerState=Number(verified.kingdom);

  if(playerState===169){
    $("continue").style.display="none";
    $("application").style.display="none";
    KSPreferences.setText($("lookupMsg"), "This account is already in State 169, so it cannot apply to transfer into State 169.");
    $("lookupMsg").className="msg warn";
    return;
  }

  $("continue").style.display="";
  KSPreferences.setText($("lookupMsg"), "✓ Player verified and eligible to apply.");
  $("lookupMsg").className="msg ok";
 }catch(e){
  KSPreferences.setError($("lookupMsg"), e);
  $("lookupMsg").className="msg error";
  $("playerCard").style.display="none";
 }finally{
  $("find").disabled=false;
  KSPreferences.setText($("find"), "Find Player");
 }
}

$("find").onclick=findPlayer;
$("fid").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();findPlayer()}};

$("continue").onclick=()=>{
  $("application").style.display="block";
  $("application").scrollIntoView({behavior:"smooth"});
};

$("change").onclick=()=>{
  verified=null;
  $("playerCard").style.display="none";
  $("application").style.display="none";
  $("successCard").style.display="none";
  $("fid").disabled=false;
  $("continue").style.display="";
  KSPreferences.setText($("lookupMsg"), "");
  $("lookupMsg").className="msg";
  $("fid").value="";
  $("fid").focus();
};

$("form").onsubmit=async e=>{
  e.preventDefault();
  if(!verified)return;

  if(Number(verified.kingdom)===169){
    KSPreferences.setText($("submitMsg"), "This account is already in State 169 and cannot submit a transfer application.");
    $("submitMsg").className="msg error";
    return;
  }

  if(!$("form").reportValidity())return;

  const data=new FormData(e.target);
  const payload={
    player_id:String(verified.player_id),
    transfer_passes:String(data.get("passes")||"").trim(),
    preferred_alliance:String(data.get("preferred")||"").trim(),
    referrer_or_friends:String(data.get("friends")||"").trim(),
    reason:String(data.get("reason")||"").trim(),
    notes:String(data.get("notes")||"").trim()
  };

  $("submitBtn").disabled=true;
  KSPreferences.setText($("submitBtn"), "Submitting…");
  KSPreferences.setText($("submitMsg"), "");
  $("submitMsg").className="msg";

  try{
    const r=await fetch(SUBMIT_URL,{
      method:"POST",
      headers:authHeaders(),
      body:JSON.stringify(payload)
    });

    let j={};
    try{j=await r.json()}catch{}

    if(!r.ok||!j.ok){
      throw KSPreferences.apiError(j.error,"Application submission failed");
    }

    $("application").style.display="none";
    KSPreferences.setText($("successMessage"),"Thanks {name}. Your transfer application has been submitted to State 169 leadership.",{name:verified.name||""});
    KSPreferences.setRawText($("successRef"), j.reference||"");
    $("successCard").style.display="block";
    $("successCard").scrollIntoView({behavior:"smooth"});

  }catch(err){
    KSPreferences.setError($("submitMsg"),err,"Application submission failed.");
    $("submitMsg").className="msg error";
  }finally{
    $("submitBtn").disabled=false;
    KSPreferences.setText($("submitBtn"), "Submit Application");
  }
};
</script>
<footer class="site-credit">
  <div data-ks-text="169 Kingshot Tools">169 Kingshot Tools</div>
  <div class="site-credit-byline" data-ks-text="Built by {author}" data-ks-params="{&quot;author&quot;:&quot;[KRZ] Uub's&quot;}">Built by [KRZ] Uub's</div>
</footer>

<script>window.KSPreferences?.mount();</script>
</body>
</html>
